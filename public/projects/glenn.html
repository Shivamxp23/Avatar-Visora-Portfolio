<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Glenn — Avataar Visora</title>
  <meta name="description" content="Glenn — UGC Project by Avataar Visora">
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: 'Inter', 'Geist Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 1200px; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
    .back-link { color: #999; text-decoration: none; font-size: 0.875rem; font-family: 'Geist Mono', monospace; letter-spacing: 0.05em; margin-bottom: 2rem; transition: color 0.2s; align-self: flex-start; }
    .back-link:hover { color: #fff; }
    .meta { text-align: center; margin-bottom: 2rem; }
    .category { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #666; margin-bottom: 0.5rem; }
    .title { font-size: 2.5rem; font-weight: 900; font-family: 'Inter', sans-serif; letter-spacing: -0.02em; }
    .year { font-size: 0.875rem; color: #666; margin-top: 0.25rem; }
    .video-wrapper { width: 100%; max-width: 900px; border-radius: 8px; overflow: hidden; border: 1px solid #222; }
    media-controller { width: 100%; display: block; --media-primary-color: #fff; --media-secondary-color: #111; --media-text-color: #fff; --media-background-color: #000; --media-control-hover-background: #333; --media-font-family: 'Inter', sans-serif; }
    video { width: 100%; display: block; }
    media-control-bar { padding: 4px 8px; }
  </style>
  <script type="module" src="https://cdn.jsdelivr.net/npm/media-chrome@4/+esm"></script>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to Portfolio</a>
    <div class="meta">
      <div class="category">UGC</div>
      <h1 class="title">Glenn</h1>
      <div class="year">2026</div>
    </div>
    <div class="video-wrapper">
      <media-controller>
        <video slot="media" src="/assets/projects/glenn.mp4" preload="metadata" playsinline crossorigin="anonymous"></video>
        <media-control-bar>
          <media-play-button></media-play-button>
          <media-seek-backward-button></media-seek-backward-button>
          <media-seek-forward-button></media-seek-forward-button>
          <media-time-range></media-time-range>
          <media-time-display showduration></media-time-display>
          <media-mute-button></media-mute-button>
          <media-volume-range></media-volume-range>
        </media-control-bar>
      </media-controller>
    </div>
  </div>
</body>
</html>
