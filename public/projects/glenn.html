<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glenn — Avataar Visora</title>
  <meta name="description" content="Glenn — UGC by Avataar Visora">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Fragment+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #ffffff;
      color: #000000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden !important;
      position: fixed;
      inset: 0;
    }
    .page-wrapper {
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.5rem 0.75rem;
      box-sizing: border-box;
      overflow: hidden;
    }
    .top-nav {
      flex: 0 0 auto;
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
    }
    .back-link {
      color: #666666;
      text-decoration: none;
      font-size: 0.82rem;
      font-family: 'Fragment Mono', 'Geist Mono', monospace;
      letter-spacing: 0.02em;
      transition: color 0.2s, transform 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-link:hover {
      color: #000000;
      transform: translateX(-3px);
    }
    .brand-tag {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.45rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #000000;
      text-decoration: none;
      line-height: 1;
    }
    .close-page-btn {
      color: #000000;
      background: #f4f4f6;
      border: 1px solid rgba(0, 0, 0, 0.1);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.2s;
    }
    .close-page-btn:hover {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
      transform: rotate(90deg) scale(1.05);
    }
    .main-stage {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .meta {
      flex: 0 0 auto;
      text-align: center;
      margin-bottom: 0.4rem;
    }
    .badge {
      display: inline-block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.82rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #000000;
      background: #f0f0f2;
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 2px 11px;
      border-radius: 999px;
      margin-bottom: 0.25rem;
      line-height: 1.1;
    }
    .title {
      font-family: 'Anton', -apple-system, sans-serif;
      font-size: clamp(1.8rem, 4.5vh, 3.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.05;
      text-transform: uppercase;
      color: #000000;
    }
    .year {
      font-size: 0.75rem;
      color: #777777;
      font-family: 'Fragment Mono', 'Geist Mono', monospace;
      margin-top: 0.2rem;
    }
    .video-container {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .video-wrapper {
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16/9;
      width: auto;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.04);
      background: #000000;
      display: flex;
    }
    media-controller {
      width: 100%;
      height: 100%;
      max-height: 100%;
      display: block;
      --media-primary-color: #ffffff;
      --media-secondary-color: #000000;
      --media-text-color: #ffffff;
      --media-background-color: #000000;
      --media-control-hover-background: rgba(255, 255, 255, 0.15);
      --media-font-family: 'Fragment Mono', monospace;
    }
    video {
      width: 100%;
      height: 100%;
      aspect-ratio: 16/9;
      display: block;
      background: #000000;
      object-fit: contain;
    }
    media-control-bar {
      padding: 8px 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    }
    .project-footer {
      flex: 0 0 auto;
      width: 100%;
      max-width: 1000px;
      margin-top: 0.4rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Fragment Mono', 'Geist Mono', monospace;
      font-size: 0.78rem;
      color: #666666;
    }
    .footer-phone {
      color: #000000;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .footer-phone:hover {
      opacity: 0.7;
    }
    .footer-socials {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer-link {
      color: #000000;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .footer-link:hover {
      opacity: 0.7;
    }
    .footer-dot {
      color: #bbbbbb;
      font-size: 0.7rem;
    }
    .footer-copy {
      color: #888888;
    }
    @media (max-width: 640px) {
      .page-wrapper { padding: 0.65rem 0.85rem 0.55rem; }
      .brand-tag { font-size: 1.25rem; }
      .project-footer {
        flex-direction: column;
        gap: 4px;
        text-align: center;
        font-size: 0.7rem;
      }
      .video-wrapper {
        width: 100%;
        height: auto;
      }
    }
  </style>
  <script type="module" src="https://cdn.jsdelivr.net/npm/media-chrome@4/+esm"></script>
</head>
<body>
  <div class="page-wrapper">
    <div class="top-nav">
      <a href="/" class="back-link">← Back to Portfolio</a>
      <a href="/" class="brand-tag">AVATAAR VISORA</a>
      <a href="/" class="close-page-btn" aria-label="Close and return to landing page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </a>
    </div>

    <div class="main-stage">
      <div class="meta">
        <div class="badge">UGC</div>
        <h1 class="title">Glenn</h1>
        <div class="year">2026</div>
      </div>
      <div class="video-container">
        <div class="video-wrapper">
          <media-controller defaultstreamtype="on-demand">
            <video slot="media" src="/assets/projects/glenn.mp4" poster="/assets/projects/glenn.png" preload="auto" playsinline autoplay controls></video>
            <media-control-bar>
              <media-play-button></media-play-button>
              <media-seek-backward-button seekoffset="10"></media-seek-backward-button>
              <media-seek-forward-button seekoffset="10"></media-seek-forward-button>
              <media-time-range></media-time-range>
              <media-time-display showduration></media-time-display>
              <media-mute-button></media-mute-button>
              <media-volume-range></media-volume-range>
            </media-control-bar>
          </media-controller>
        </div>
      </div>
    </div>

    <footer class="project-footer">
      <div class="footer-left">
        <a href="tel:+918320302482" class="footer-phone">+918320302482</a>
      </div>
      <div class="footer-socials">
        <a href="https://wa.me/918320302482" target="_blank" rel="noopener" class="footer-link">WA</a>
        <span class="footer-dot">•</span>
        <a href="https://instagram.com" target="_blank" rel="noopener" class="footer-link">IG</a>
        <span class="footer-dot">•</span>
        <a href="https://x.com" target="_blank" rel="noopener" class="footer-link">X</a>
      </div>
      <div class="footer-right">
        <span class="footer-copy">©2026 Avataar Visora.</span>
      </div>
    </footer>
  </div>

  <script>
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
