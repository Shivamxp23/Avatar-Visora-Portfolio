  <style>

    html, body {

    .title {

    .progress-bar {

    .time-row {

    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: #000000;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .play-btn:hover {

    .vol-row {
      margin-top: 0.75rem;

    .vol-slider {

      height: 4px;

      appearance: none;

      cursor: pointer;
    }
    .project-footer {
      flex: 0 0 auto;
      width: 100%;
      max-width: 620px;
      margin-top: 0.4rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Fragment Mono', 'Geist Mono', monospace;

    }
    .footer-phone {
      color: #000000;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .footer-phone:hover {

    }
    .footer-socials {
      display: flex;

    @media (max-width: 640px) {

      .player-card { padding: 1.25rem 1.1rem; }

        flex-direction: column;
        gap: 4px;

  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="top-nav">
      <a href="/" class="back-link">← Back to Portfolio</a>
      <a href="/" class="brand-tag">AVATAAR VISORA</a>
      <a href="/" class="close-page-btn" aria-label="Close and return to landing page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </a>
    </div>

    <div class="player-card">
      <div class="badge">Jingles</div>
      <h1 class="title">B Tex</h1>
      <div class="artist">Avataar Visora • 2026</div>

      <canvas id="canvas" class="visualizer-canvas" width="600" height="70"></canvas>

      <div class="timeline">
        <input type="range" id="seek" class="progress-bar" value="0" min="0" max="100" step="0.1">
        <div class="time-row">
          <span id="cur-time">0:00</span>
          <span id="dur-time">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="play-btn" class="play-btn" aria-label="Play or pause">
          <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
      </div>

      <div class="vol-row">
        <span>VOL</span>
        <input type="range" id="vol" class="vol-slider" min="0" max="1" step="0.01" value="0.9">
      </div>

      <audio id="audio" src="/assets/projects/b-tex.mp3" preload="auto" autoplay><source src="/assets/projects/b-tex.mp3" type="audio/mpeg"><source src="/assets/projects/b-tex.wav" type="audio/wav"></audio>
    </div>

    <footer class="project-footer">
      <div class="footer-left">
        <a href="tel:+918320302482" class="footer-phone">+918320302482</a>
      </div>
      <div class="footer-socials">
        <a href="https://wa.me/918320302482" target="_blank" rel="noopener" class="footer-link">WA</a>
        <span class="footer-dot">•</span>
        <a href="https://www.instagram.com/avataar.visora" target="_blank" rel="noopener" class="footer-link">IG</a>
      </div>
      <div class="footer-right">
        <span class="footer-copy">©2026 Avataar Visora.</span>
      </div>
    </footer>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const seek = document.getElementById('seek');
    const curTime = document.getElementById('cur-time');
    const durTime = document.getElementById('dur-time');
    const vol = document.getElementById('vol');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function fmt(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function updatePlayIcon(isPlaying) {
      if (isPlaying) {
        playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
      } else {
        playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      }
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => updatePlayIcon(true));
    audio.addEventListener('pause', () => updatePlayIcon(false));
    audio.addEventListener('ended', () => updatePlayIcon(false));

    audio.addEventListener('loadedmetadata', () => {
      durTime.textContent = fmt(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      curTime.textContent = fmt(audio.currentTime);
      if (audio.duration) {
        seek.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    seek.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (seek.value / 100) * audio.duration;
      }
    });

    vol.addEventListener('input', () => {
      audio.volume = vol.value;
    });

    // Elegant monochrome waveform animation
    let animId;
    const barCount = 48;
    const barWidth = 4;
    const gap = 4;

    function renderWaveform() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isPlaying = !audio.paused && !audio.ended;
      const progress = audio.duration ? (audio.currentTime / audio.duration) : 0;
      const activeBarCount = Math.floor(progress * barCount);

      const totalW = barCount * (barWidth + gap);
      const startX = (canvas.width - totalW) / 2;

      for (let i = 0; i < barCount; i++) {
        let h;
        if (isPlaying) {
          const t = Date.now() * 0.005;
          h = Math.sin(t + i * 0.4) * 16 + Math.cos(t * 0.8 + i * 0.2) * 12 + 28;
        } else {
          h = 8 + Math.sin(i * 0.5) * 6;
        }
        h = Math.max(5, Math.min(canvas.height - 10, h));
        const x = startX + i * (barWidth + gap);
        const y = (canvas.height - h) / 2;

        ctx.fillStyle = (i <= activeBarCount) ? '#000000' : '#d4d4d8';
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, h, 2);
        ctx.fill();
      }
      animId = requestAnimationFrame(renderWaveform);
    }

    renderWaveform();

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        window.location.href = '/';
      }
      if (e.key === ' ' && e.target !== seek && e.target !== vol) {
        e.preventDefault();
        if (audio.paused) audio.play(); else audio.pause();
      }
    });
  </script>
</body>
